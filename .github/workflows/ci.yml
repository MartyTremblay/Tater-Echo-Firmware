name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  onnxruntime-armv7-cache:
    name: Warm Linux ARMv7 ONNX Runtime cache
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore pinned ONNX Runtime
        id: onnxruntime-cache
        uses: actions/cache@v6
        with:
          path: |
            device/build/onnxruntime-linux-armv7/libonnxruntime.so
            device/build/onnxruntime-linux-armv7/.required-operators-sha256
            device/build/onnxruntime/include/onnxruntime_c_api.h
          key: tater-onnxruntime-linux-armv7-v1-${{ hashFiles('device/prepare_onnxruntime_linux_armv7.sh', 'device/onnxruntime/**') }}
      - name: Set up ARMv7 emulation
        if: steps.onnxruntime-cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Build pinned Linux ARMv7 ONNX Runtime
        if: steps.onnxruntime-cache.outputs.cache-hit != 'true'
        run: device/prepare_onnxruntime_linux_armv7.sh
      - name: Verify cached ONNX Runtime
        run: |
          file device/build/onnxruntime-linux-armv7/libonnxruntime.so | grep -q '32-bit.*ARM'
          test -s device/build/onnxruntime/include/onnxruntime_c_api.h

  device-tests:
    name: Firmware and installer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Go tests
        working-directory: device
        run: go test ./internal/... ./pkg/... ./cmd/tater-show-linux
      - name: Run factory and release tests
        run: |
          python3 -m unittest \
            tools.test_build_scripts \
            tools.test_merge_release_manifests \
            tools.test_package_echo_release \
            tools.test_release_notes
          python3 -m unittest discover -s linux/checkers -p 'test_*.py'
          python3 -m unittest discover -s factory/checkers-linux -p 'test_*.py'
          python3 -m unittest discover -s linux/rook -p 'test_*.py'
          python3 -m unittest discover -s factory/rook-linux -p 'test_*.py'
          python3 -m py_compile \
            linux/dot/build_rootfs.py \
            factory/dot-linux/install.py \
            tools/package_echo_release.py \
            linux/rook/build_boot.py \
            linux/rook/build_rescue_fbprobe.py \
            linux/rook/build_rootfs.py \
            linux/rook/preflight.py \
            factory/rook-linux/build_factory.py \
            factory/rook-linux/install.py
      - name: Check shell entrypoints
        run: |
          sh -n linux/dot/build_linux.sh
          sh -n linux/dot/setup-ap.sh
          sh -n linux/dot/techo5-net
          sh -n linux/dot/wifi-set
          sh -n factory/dot-linux/install.sh
      - name: Test native microWakeWord runtime
        working-directory: device
        run: ./test_microwakeword_runtime.sh

  static-analysis:
    name: Firmware static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum
      - name: Run go vet
        working-directory: device
        run: go vet ./internal/... ./pkg/...
      - name: Run govulncheck
        working-directory: device
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./internal/... ./pkg/... || true
      - name: Check Python packers for undefined names
        run: |
          python3 -m pip install pyflakes
          python3 -m pyflakes \
            linux/dot/build_rootfs.py \
            factory/dot-linux/install.py \
            tools/package_echo_release.py
